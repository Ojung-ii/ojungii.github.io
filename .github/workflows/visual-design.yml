name: Visual design smoke
on:
  pull_request:
    paths:
      - 'assets/**'
      - 'research/**'
      - 'projects/**'
      - 'tests/site-visual-smoke.mjs'
      - '.github/workflows/visual-design.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser automation tools
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps --only-shell chromium
      - name: Serve static portfolio
        run: |
          python3 -m http.server 8123 --bind 127.0.0.1 > /tmp/portfolio-server.log 2>&1 &
          sleep 2
          curl --fail http://127.0.0.1:8123/research/star/ > /dev/null
      - name: Verify desktop and mobile layout / themes / interactions
        run: node tests/site-visual-smoke.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: detail-page-design-previews
          path: design-previews/
          if-no-files-found: ignore
          retention-days: 14
