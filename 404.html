<!doctype html>
<html lang="ko" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <meta name="color-scheme" content="light dark" />
    <title>404 | Junghyun Oh</title>
    <style>
      :root { color-scheme: light; --bg:#fff; --surface:#f5f7fb; --text:#071426; --muted:#5f6b7c; --navy:#0b2b53; --line:#dde4ee; }
      @media (prefers-color-scheme: dark) { :root { color-scheme: dark; --bg:#07111f; --surface:#0b1728; --text:#f7faff; --muted:#a7b4c8; --navy:#8eb8ef; --line:#20324a; } }
      * { box-sizing:border-box; }
      body { margin:0; min-height:100vh; display:grid; place-items:center; padding:24px; color:var(--text); background:var(--bg); font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR",sans-serif; }
      main { width:min(100%,680px); padding:clamp(36px,7vw,72px); border:1px solid var(--line); border-radius:28px; background:var(--surface); }
      .code { margin:0 0 18px; color:var(--navy); font:700 13px/1.2 ui-monospace,SFMono-Regular,Consolas,monospace; letter-spacing:.12em; }
      h1 { margin:0 0 18px; font-size:clamp(38px,8vw,72px); line-height:1.03; letter-spacing:-.055em; }
      p { margin:0 0 30px; color:var(--muted); font-size:17px; line-height:1.75; }
      a { display:inline-flex; padding:13px 20px; border-radius:999px; color:#fff; background:#0b2b53; font-weight:750; text-decoration:none; }
    </style>
  </head>
  <body>
    <main>
      <p class="code">404 · PAGE NOT FOUND</p>
      <h1>길을 잃은 페이지입니다.</h1>
      <p>요청한 페이지를 찾을 수 없습니다.<br />The page you requested could not be found.</p>
      <a href="/">홈으로 돌아가기 · Back home</a>
    </main>
  </body>
</html>
